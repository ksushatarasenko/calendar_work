<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Raport zmian</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/styles.css">

    <!-- Supabase UMD -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script> -->

    <!-- Core -->
    <!-- <script type="module" src="../js/core/auth.js"></script> -->
</head>

<body>
    <div class="wrapperRaport">

        <!-- ==== HEADER ==== -->
        <div class="headRaport">
            <h1>Raport zmian</h1>
            <div id="rangeText" class="report-range"></div>
        </div>


        <!-- ==== TABLE ==== -->
        <table class="report-table" id="workTable">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Od</th>
                    <th>Do</th>
                    <th>Godziny</th>
                    <th>Miejsce</th>
                    <th>Osoba</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- ==== SUMA GODZIN ==== -->
        <div id="totalHours" class="report-sum">Łącznie godzin: 0.00</div>

        <!-- FOOTER -->
        <div class="report-footer">Koniec raportu</div>

    </div>

    <script type="module">
        import { openDB } from "../js/core/idb.js";

        const params = new URLSearchParams(window.location.search);
        const dateFrom = params.get("from");
        const dateTo = params.get("to");

        document.getElementById("rangeText").textContent =
            `Za okres: ${dateFrom} → ${dateTo}`;

        const db = await openDB();
        const tx = db.transaction("works", "readonly");
        const store = tx.objectStore("works");

        const rows = [];
        store.openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                const v = cursor.value;
                if (v.date >= dateFrom && v.date <= dateTo) {
                    rows.push(v);
                }
                cursor.continue();
            } else {
                rows.sort((a, b) => a.date.localeCompare(b.date));
                render(rows);
            }
        };

        function render(rows) {
            const tbody = document.querySelector("#workTable tbody");
            tbody.innerHTML = "";

            let total = 0;

            rows.forEach(r => {
                const tr = document.createElement("tr");

                const hours =
                    r.start_time && r.end_time
                        ? (
                            (new Date(`1970-01-01T${r.end_time}`) -
                                new Date(`1970-01-01T${r.start_time}`)) / 36e5
                        ).toFixed(2)
                        : "0.00";

                tr.innerHTML = `
            <td>${r.date}</td>
            <td>${r.start_time || ""}</td>
            <td>${r.end_time || ""}</td>
            <td>${hours}</td>
            <td>${r.place || ""}</td>
            <td>${r.partner || ""}</td>
        `;

                tbody.appendChild(tr);
                total += Number(hours);
            });

            document.getElementById("totalHours").textContent =
                `Łącznie godzin: ${total.toFixed(2)}`;
        }
    </script>

</body>

</html>
